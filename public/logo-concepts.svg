<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 190" font-family="'Segoe UI','Hiragino Sans',sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B92B96"/><stop offset="1" stop-color="#8A1A6D"/>
    </linearGradient>
  </defs>
  <rect width="560" height="190" fill="#F5F0F4"/>

  <!-- A: レーダーリング（観測の波紋 + 自社のドット） -->
  <rect x="20" y="20" width="110" height="110" rx="26" fill="url(#g)"/>
  <circle cx="75" cy="75" r="14" fill="none" stroke="#FFFFFF" stroke-width="5"/>
  <circle cx="75" cy="75" r="28" fill="none" stroke="#F5E6F0" stroke-opacity="0.55" stroke-width="4"
          stroke-dasharray="24 10" stroke-linecap="round"/>
  <circle cx="75" cy="75" r="40" fill="none" stroke="#F5E6F0" stroke-opacity="0.25" stroke-width="4"
          stroke-dasharray="16 12" stroke-linecap="round"/>
  <circle cx="103" cy="47" r="6.5" fill="#FFFFFF"/>
  <text x="75" y="152" font-size="13" font-weight="700" fill="#2A1F27" text-anchor="middle">A 観測レーダー</text>

  <!-- B: 吹き出し + 上昇矢印（AIの回答の中で上がる） -->
  <rect x="160" y="20" width="110" height="110" rx="26" fill="url(#g)"/>
  <path d="M187 50a12 12 0 0 1 12-12h44a12 12 0 0 1 12 12v30a12 12 0 0 1-12 12h-24l-14 13v-13h-6a12 12 0 0 1-12-12z"
        fill="#FFFFFF"/>
  <path d="M199 78l13-14 8 7 14-16" fill="none" stroke="#A62183" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M226 54h9v9" fill="none" stroke="#A62183" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="215" y="152" font-size="13" font-weight="700" fill="#2A1F27" text-anchor="middle">B 回答×上昇</text>

  <!-- C: POモノグラム（幾何学） -->
  <rect x="300" y="20" width="110" height="110" rx="26" fill="#FFFFFF" stroke="#EADFE7" stroke-width="2"/>
  <path d="M327 105V45h22a19 19 0 0 1 0 38h-10" fill="none" stroke="url(#g)" stroke-width="12" stroke-linecap="round"/>
  <circle cx="373" cy="86" r="17" fill="none" stroke="#A62183" stroke-width="12"/>
  <text x="355" y="152" font-size="13" font-weight="700" fill="#2A1F27" text-anchor="middle">C POモノグラム</text>

  <!-- D: 可視性の目（レンズ + 軌道） -->
  <rect x="440" y="20" width="110" height="110" rx="26" fill="url(#g)"/>
  <path d="M462 75c10-16 22-24 33-24s23 8 33 24c-10 16-22 24-33 24s-23-8-33-24z" fill="#FFFFFF"/>
  <circle cx="495" cy="75" r="12" fill="#A62183"/>
  <circle cx="495" cy="75" r="4.5" fill="#FFFFFF"/>
  <ellipse cx="495" cy="75" rx="44" ry="16" fill="none" stroke="#F5E6F0" stroke-opacity="0.5" stroke-width="3"
           transform="rotate(-18 495 75)" stroke-dasharray="30 12" stroke-linecap="round"/>
  <text x="495" y="152" font-size="13" font-weight="700" fill="#2A1F27" text-anchor="middle">D 可視性の目</text>
</svg>
