<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Pal Opt ロゴマーク: 「AIの回答の中で見つかる」= スパーク + 観測レーダーの波紋 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B92B96"/>
      <stop offset="1" stop-color="#8A1A6D"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#bg)"/>
  <!-- レーダー波紋（観測） -->
  <circle cx="60" cy="60" r="34" fill="none" stroke="#F5E6F0" stroke-opacity="0.35" stroke-width="3"
          stroke-dasharray="40 14" stroke-linecap="round"/>
  <circle cx="60" cy="60" r="45" fill="none" stroke="#F5E6F0" stroke-opacity="0.18" stroke-width="3"
          stroke-dasharray="26 18" stroke-linecap="round"/>
  <!-- 中央のスパーク（AIに見つかる輝き） -->
  <path fill="#FFFFFF" d="M60 32c2.2 12.6 8.4 20.4 24 23-15.6 2.6-21.8 10.4-24 23-2.2-12.6-8.4-20.4-24-23 15.6-2.6 21.8-10.4 24-23z"/>
  <!-- サブスパーク -->
  <path fill="#F5E6F0" d="M84 36c0.9 4.8 3.2 7.8 9 8.8-5.8 1-8.1 4-9 8.8-0.9-4.8-3.2-7.8-9-8.8 5.8-1 8.1-4 9-8.8z"/>
</svg>
